<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17352b">
<title>ReviewGuard — Customer Feedback</title>
<style>
:root{--ink:#18372c;--muted:#68776f;--line:#e3e9e5;--bg:#f5f7f5;--lime:#d9f99d;--white:#fff;--amber:#b7791f;--red:#b42318;--green:#21734a;--blue:#285fbd}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1b2b23;font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 15px;font-weight:650;background:var(--ink);color:#fff}button:hover{filter:brightness(1.08)}button.secondary{background:#edf2ee;color:var(--ink);border:1px solid var(--line)}button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}button.small{padding:7px 10px;font-size:13px}
.app{max-width:1180px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 8px 40px #152c1b0b}.top{background:var(--ink);color:#fff;padding:22px 26px 16px}.brandrow{display:flex;align-items:center;gap:12px}.logo{width:43px;height:43px;border-radius:13px;background:var(--lime);color:var(--ink);display:grid;place-items:center;font-size:23px;font-weight:900}.brand{font-size:22px;font-weight:800;letter-spacing:-.6px}.tagline{font-size:12px;color:#c8d8cf;letter-spacing:1px}.topnote{margin:15px 0 0;color:#d9e5de;font-size:14px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}.nav button{background:#2c493d;color:#e9f2ec;padding:9px 12px;font-size:13px}.nav button.active{background:var(--lime);color:var(--ink)}main{padding:25px;min-height:600px}.eyebrow{color:var(--muted);font-size:11px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.pagehead h1{font-size:28px;letter-spacing:-.8px;margin:5px 0}.sub{color:var(--muted);margin:0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.stat,.panel,.feedback-card{border:1px solid var(--line);border-radius:17px;padding:17px;background:#fff}.stat .label{color:var(--muted);font-size:12px}.stat .value{font-size:30px;font-weight:800;letter-spacing:-1px;margin:6px 0}.stat .hint{color:var(--muted);font-size:12px}.two-col{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-top:16px}.panel h2{font-size:16px;margin:0 0 14px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.panel-head h2{margin:0}.barrow{display:grid;grid-template-columns:50px 1fr 28px;align-items:center;gap:9px;margin:12px 0;font-size:13px}.bar{height:9px;background:#edf1ed;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:#80a96e;border-radius:9px}.pill{display:inline-flex;align-items:center;border-radius:99px;padding:4px 9px;font-size:11px;font-weight:750;background:#f1f3f1;color:#4b5b51}.pill.warn{background:#fff4d6;color:#895a08}.pill.good{background:#e3f5e9;color:#17663c}.pill.blue{background:#e9f0ff;color:#285fbd}.feedlist{display:grid;gap:10px}.feedback-card{padding:14px}.f-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.stars{letter-spacing:2px;color:#d49a18;font-size:16px;white-space:nowrap}.f-category{font-weight:750;margin:7px 0 3px}.f-comment{color:#435249;margin:0 0 8px}.meta{font-size:12px;color:var(--muted)}.f-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.filters button{font-size:12px;padding:8px 11px}.filters button.selected{background:var(--ink);color:white}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-size:13px;font-weight:750}.field input,.field textarea,.field select{width:100%;border:1px solid #d6dfd9;border-radius:10px;padding:11px 12px;background:#fff;color:#1b2b23}.field textarea{min-height:100px;resize:vertical}.help{font-size:12px;color:var(--muted)}.customer-wrap{max-width:510px;margin:0 auto}.customer-card{border:1px solid var(--line);border-radius:22px;padding:25px;background:#fff;text-align:center}.business-mark{width:62px;height:62px;border-radius:19px;background:#edf4e9;color:var(--ink);display:grid;place-items:center;font-size:28px;margin:0 auto 12px}.customer-card h1{font-size:25px;margin:4px 0 7px}.customer-card p{color:var(--muted);margin:0}.ratingrow{display:flex;justify-content:center;gap:8px;margin:22px 0}.starbtn{font-size:30px;padding:6px 8px;background:transparent;color:#c8d0ca;border-radius:10px}.starbtn.active{color:#d49a18;background:#fff8e5}.category-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 18px;text-align:left}.cat{background:#fff;color:#314338;border:1px solid var(--line);text-align:left;font-size:13px;padding:10px}.cat.selected{background:#eff8e6;border-color:#8aaf6e;color:var(--ink)}.customer-actions{display:grid;gap:9px;margin-top:16px}.qr-layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}.qrbox{background:#f7faf7;border:1px dashed #b9c8bd;border-radius:16px;display:grid;place-items:center;padding:20px;min-height:250px}.qrbox canvas,.qrbox img{max-width:100%;height:auto!important}.toast{padding:11px 13px;border-radius:10px;background:#e8f7ed;color:#17663c;margin-bottom:14px;font-size:13px}.empty{text-align:center;padding:35px;color:var(--muted)}.footer{padding:17px 25px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.notice{padding:12px;border-radius:12px;background:#f3f7f3;color:#435249;font-size:12px;margin-top:14px}.notice strong{color:var(--ink)}.successmark{font-size:42px;color:var(--green)}.hidden{display:none!important}
@media(max-width:800px){main{padding:17px}.top{padding:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col,.qr-layout{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.pagehead h1{font-size:24px}.stat{padding:14px}.stat .value{font-size:27px}}
@media(max-width:420px){.grid{gap:8px}.stat .value{font-size:24px}.nav button{flex:1}.customer-card{padding:18px}.ratingrow{gap:2px}.starbtn{font-size:27px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brandrow"><div class="logo">R</div><div><div class="brand">ReviewGuard</div><div class="tagline">CUSTOMER FEEDBACK PLATFORM</div></div><span class="pill" style="margin-left:auto;background:#d9f99d;color:#17352b">DEMO</span></div>
  <p class="topnote">Better feedback. Better experiences. Stronger businesses.</p>
  <nav class="nav" aria-label="Main navigation">
    <button class="active" data-page="dashboard">▦ Dashboard</button>
    <button data-page="feedback">☷ Feedback inbox</button>
    <button data-page="customer">▣ Customer demo</button>
    <button data-page="settings">⚙ Setup & QR</button>
  </nav>
</header>
<main id="main"></main>
<footer class="footer"><span>ReviewGuard prototype · Demo data is stored in this browser only.</span><span>Honest reviews by design</span></footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const defaultSettings={name:"The Daily Grind",category:"Cafe",googleUrl:"https://g.page/r/your-business/review",slug:"daily-grind"};
const defaultFeedback=[
{id:1,rating:2,category:"Service speed",comment:"Waited 20 minutes for my coffee.",time:"10 min ago",resolved:false},
{id:2,rating:3,category:"Food / product quality",comment:"Coffee was good, but the pastry was cold.",time:"32 min ago",resolved:false},
{id:3,rating:5,category:"Staff behaviour",comment:"Friendly staff and lovely atmosphere!",time:"1 hr ago",resolved:false}
];
function load(key,fallback){try{const x=localStorage.getItem("rg_"+key);return x?JSON.parse(x):fallback}catch{return fallback}}
let settings=load("settings",defaultSettings),feedback=load("feedback",defaultFeedback),page="dashboard",filter="All",selectedRating=0,selectedCategory="",customerComment="",customerSubmitted=false,notice="";
function save(){localStorage.setItem("rg_settings",JSON.stringify(settings));localStorage.setItem("rg_feedback",JSON.stringify(feedback))}
function stars(n){return "★".repeat(n)+"☆".repeat(5-n)}
function avg(){return feedback.length?(feedback.reduce((a,f)=>a+f.rating,0)/feedback.length).toFixed(1):"—"}
function unresolved(){return feedback.filter(f=>f.rating<=3&&!f.resolved).length}
function go(p){page=p;notice="";document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));render()}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
function toast(t){notice=t;render()}
function feedbackCard(f){return `<article class="feedback-card"><div class="f-top"><div><div class="stars" aria-label="${f.rating} out of 5">${stars(f.rating)} <span style="font-size:12px;color:#405046;letter-spacing:0">${f.rating}/5</span></div><div class="f-category">${esc(f.category||"General feedback")}</div></div><span class="pill ${f.resolved?"good":f.rating<=3?"warn":"blue"}">${f.resolved?"Resolved":f.rating<=3?"Needs attention":"New feedback"}</span></div><p class="f-comment">${esc(f.comment||"No additional comment provided.")}</p><div class="meta">${esc(f.time||"Recently")} · Customer feedback</div><div class="f-actions"><button class="secondary small" data-resolve="${f.id}">${f.resolved?"↶ Reopen issue":"✓ Mark resolved"}</button></div></article>`}
function dashboard(){return `<div class="pagehead"><div><div class="eyebrow">Business overview / Demo data</div><h1>Good afternoon 👋</h1><p class="sub">Here's how ${esc(settings.name)} is doing.</p></div><button data-goto="settings">Configure QR ↗</button></div>
${notice?`<div class="toast">${esc(notice)}</div>`:""}
<div class="grid">
<div class="stat"><div class="label">★ Average feedback</div><div class="value">${avg()}<span style="font-size:14px;color:#68776f"> / 5</span></div><div class="hint">Private customer feedback</div></div>
<div class="stat"><div class="label">☷ Responses</div><div class="value">${feedback.length}</div><div class="hint">Total submissions</div></div>
<div class="stat"><div class="label">⚑ Needs attention</div><div class="value">${unresolved()}</div><div class="hint">Unresolved ratings of 1–3</div></div>
<div class="stat"><div class="label">✓ Resolved</div><div class="value">${feedback.filter(f=>f.resolved).length}</div><div class="hint">Issues marked resolved</div></div>
</div>
<div class="two-col"><section class="panel"><div class="panel-head"><h2>Rating distribution</h2><span class="pill">All feedback</span></div>${[5,4,3,2,1].map(n=>{let count=feedback.filter(f=>f.rating===n).length,pct=feedback.length?count/feedback.length*100:0;return `<div class="barrow"><span>${n} star${n>1?"s":""}</span><div class="bar"><span style="width:${pct}%"></span></div><b>${count}</b></div>`}).join("")}<p class="help">Use these insights to improve customer experience—not to filter who can review you publicly.</p></section>
<section class="panel"><div class="panel-head"><h2>Recent feedback</h2><button class="secondary small" data-goto="feedback">View all</button></div><div class="feedlist">${feedback.slice(0,3).map(f=>`<div><div class="f-top"><span class="stars">${stars(f.rating)}</span><span class="meta">${esc(f.time)}</span></div><div class="f-category">${esc(f.category)}</div><p class="f-comment">${esc(f.comment)}</p></div>`).join("")||'<div class="empty">No feedback yet.</div>'}</div></section></div>
<div class="notice"><strong>Privacy & trust:</strong> Private feedback is for service improvement. Every customer can access the same optional Google review invitation regardless of rating.</div>`}
function inbox(){let list=feedback.filter(f=>filter==="All"||(filter==="Needs attention"&&f.rating<=3&&!f.resolved)||(filter==="Resolved"&&f.resolved));return `<div class="pagehead"><div><div class="eyebrow">Customer voice</div><h1>Feedback inbox</h1><p class="sub">Understand concerns and track follow-up.</p></div><span class="pill">${feedback.length} total</span></div>${notice?`<div class="toast">${esc(notice)}</div>`:""}<div class="filters">${["All","Needs attention","Resolved"].map(x=>`<button class="${filter===x?"selected":"secondary"}" data-filter="${x}">${x}</button>`).join("")}</div><div class="feedlist">${list.map(feedbackCard).join("")||'<div class="empty panel">Nothing in this view yet.</div>'}</div>`}
function customer(){return `<div class="customer-wrap"><div class="eyebrow" style="text-align:center;margin-bottom:12px">Customer experience preview</div><section class="customer-card">${customerSubmitted?`<div class="successmark">✓</div><h1>Thank you for your feedback!</h1><p>Your response has been recorded in this demo. Your feedback helps ${esc(settings.name)} improve.</p><div class="notice" style="text-align:left;margin-top:20px"><strong>Would you also like to share your experience on Google?</strong><br>This is completely optional. You can leave an honest review regardless of your rating or private feedback.</div><div class="customer-actions"><a href="${esc(settings.googleUrl)}" target="_blank" rel="noopener noreferrer" style="text-decoration:none"><button style="width:100%">Continue to Google review ↗</button></a><button class="secondary" id="try-again">Try another response</button></div>`:`<div class="business-mark">♡</div><h1>${esc(settings.name)}</h1><p>${esc(settings.category)} · Your feedback helps us improve</p><h2 style="margin:25px 0 4px">How was your experience?</h2><p>Tell us what went well or what we can do better.</p><div class="ratingrow" role="group" aria-label="Select rating">${[1,2,3,4,5].map(n=>`<button class="starbtn ${selectedRating>=n?"active":""}" data-rating="${n}" aria-label="${n} stars">${selectedRating>=n?"★":"☆"}</button>`).join("")}</div>${selectedRating?`<div style="text-align:left"><label style="font-weight:750;font-size:13px">What stood out or could be improved? (Optional)</label><div class="category-grid">${["Service speed","Food / product quality","Staff behaviour","Cleanliness","Pricing","Other"].map(c=>`<button class="cat ${selectedCategory===c?"selected":""}" data-category="${c}">${selectedCategory===c?"✓ ":""}${c}</button>`).join("")}</div><div class="field"><label for="customer-comment">Additional comments (optional)</label><textarea id="customer-comment" placeholder="Share more details...">${esc(customerComment)}</textarea></div><button id="submit-feedback" style="width:100%">Submit feedback →</button></div>`:""}`}<p class="help" style="margin-top:18px">Demo only · Avoid sharing sensitive personal information.</p></section></div>`}
function setup(){return `<div class="pagehead"><div><div class="eyebrow">Workspace settings</div><h1>Business setup</h1><p class="sub">Configure what customers see when scanning your QR code.</p></div></div>${notice?`<div class="toast">${esc(notice)}</div>`:""}<div class="qr-layout"><section class="panel"><h2>Business profile</h2><form id="settings-form"><div class="field"><label for="business-name">Business name</label><input id="business-name" required value="${esc(settings.name)}"></div><div class="field"><label for="business-category">Business category</label><select id="business-category">${["Cafe","Restaurant","Salon","Retail store","Clinic","Other service"].map(c=>`<option ${settings.category===c?"selected":""}>${c}</option>`).join("")}</select></div><div class="field"><label for="google-url">Google review URL</label><input id="google-url" type="url" value="${esc(settings.googleUrl)}" placeholder="https://g.page/r/.../review"><span class="help">Use your real Google review link before launch.</span></div><div class="field"><label for="slug">Public page slug</label><input id="slug" value="${esc(settings.slug)}" pattern="[A-Za-z0-9-]+" required><span class="help">In this static demo, the QR opens the current site's customer page.</span></div><button type="submit">Save settings</button></form></section><section class="panel"><h2>Customer QR code</h2><p class="sub" style="font-size:13px;margin-bottom:14px">Scan to open the customer feedback page on this deployment.</p><div class="qrbox"><div id="qrcode"></div><div id="qr-fallback" class="help hidden">QR code library couldn't load. Deploy with internet access and refresh.</div></div><div class="field" style="margin-top:15px"><label for="qr-url">QR destination URL</label><input id="qr-url" readonly></div><button class="secondary" id="copy-url" style="width:100%">Copy customer page URL</button><button class="ghost" id="download-qr" style="width:100%;margin-top:8px">Download QR PNG</button><p class="help" style="margin-top:10px">The generated QR is real and scannable when this site is hosted at a public URL. For local preview, it points to your local address.</p></section></div><div class="notice"><strong>Launch checklist:</strong> set a real Google review URL, deploy to a public HTTPS URL, scan the QR from another phone, and test feedback on mobile. This prototype stores data in this browser only; it is not yet a multi-user production system.</div>`}
function render(){const root=$("#main");root.innerHTML=page==="dashboard"?dashboard():page==="feedback"?inbox():page==="customer"?customer():setup();bindPage();if(page==="settings")makeQR()}
function bindPage(){
document.querySelectorAll("[data-goto]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.goto)));
document.querySelectorAll("[data-resolve]").forEach(b=>b.addEventListener("click",()=>{const id=Number(b.dataset.resolve);feedback=feedback.map(f=>f.id===id?{...f,resolved:!f.resolved}:f);save();render()}));
document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{filter=b.dataset.filter;render()}));
document.querySelectorAll("[data-rating]").forEach(b=>b.addEventListener("click",()=>{selectedRating=Number(b.dataset.rating);render()}));
document.querySelectorAll("[data-category]").forEach(b=>b.addEventListener("click",()=>{selectedCategory=b.dataset.category;render()}));
const comment=$("#customer-comment");if(comment)comment.addEventListener("input",e=>customerComment=e.target.value);
const submit=$("#submit-feedback");if(submit)submit.addEventListener("click",()=>{if(!selectedRating)return;feedback.unshift({id:Date.now(),rating:selectedRating,category:selectedCategory||"General feedback",comment:customerComment.trim()||"No additional comment provided.",time:"Just now",resolved:false});save();customerSubmitted=true;render()});
const again=$("#try-again");if(again)again.addEventListener("click",()=>{customerSubmitted=false;selectedRating=0;selectedCategory="";customerComment="";render()});
const form=$("#settings-form");if(form)form.addEventListener("submit",e=>{e.preventDefault();settings={...settings,name:$("#business-name").value.trim(),category:$("#business-category").value,googleUrl:$("#google-url").value.trim(),slug:$("#slug").value.trim()};save();notice="Settings saved in this browser.";render()});
const copy=$("#copy-url");if(copy)copy.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(location.href.split("#")[0]+"#customer");toast("Customer page URL copied.")}catch{toast("Copy unavailable. Select the URL field and copy it manually.")}});
const dl=$("#download-qr");if(dl)dl.addEventListener("click",()=>{const canvas=$("#qrcode canvas"),img=$("#qrcode img");const src=canvas?canvas.toDataURL("image/png"):img?.src;if(!src){toast("QR code is not ready yet.");return}const a=document.createElement("a");a.href=src;a.download=(settings.slug||"business")+"-feedback-qr.png";a.click()});
}
function makeQR(){const box=$("#qrcode"),url=$("#qr-url");if(!box)return;const destination=location.href.split("#")[0]+"#customer";url.value=destination;box.innerHTML="";if(window.QRCode){new QRCode(box,{text:destination,width:200,height:200,colorDark:"#17352b",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H});$("#qr-fallback").classList.add("hidden")}else{$("#qr-fallback").classList.remove("hidden")}}
function boot(){if(location.hash==="#customer")page="customer";document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));render()}
window.addEventListener("hashchange",()=>{if(location.hash==="#customer")go("customer")});boot();
</script>
</body>
</html>
